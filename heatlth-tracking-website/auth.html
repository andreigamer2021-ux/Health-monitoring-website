<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-card">
        <h1>Health Tracker</h1>
        <p>Sign in or create an account to open your dashboard.</p>
        <form id="auth-form">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" type="password" minlength="8"
                autocomplete="current-password" required>

            <button id="auth-submit" type="submit">Sign in</button>
        </form>
        <button id="toggle-auth-mode" class="auth-secondary" type="button">
            Need an account? Sign up
        </button>
        <p id="auth-status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="auth.js"></script>
</body>
</html>
