<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 112">
    <style>
        .leg-left, .leg-right {
            transform-box: view-box;
        }
        .leg-left {
            transform-origin: 35px 98px;
            animation: step-cycle 560ms ease-in-out infinite;
        }
        .leg-right {
            transform-origin: 65px 98px;
            animation: step-cycle 560ms ease-in-out infinite;
            animation-delay: -280ms;
        }
        @keyframes step-cycle {
            0%, 100% { transform: rotate(-17deg) translateY(-1px); }
            25% { transform: rotate(0) translateY(1px); }
            50% { transform: rotate(17deg) translateY(-3px); }
            75% { transform: rotate(0) translateY(1px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .leg-left, .leg-right { animation: none; }
        }
    </style>

