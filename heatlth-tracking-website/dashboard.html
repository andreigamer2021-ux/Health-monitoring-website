<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track your health here!!</title>
    <!-- Conectare la fișierul CSS extern -->
    <link rel="stylesheet" href="style.css">
</head>
<body hidden>
    <div class="account-bar">
        <span id="user-email"></span>
        <button id="sign-out" type="button">Sign out</button>
        <span id="account-status" role="status" aria-live="polite"></span>
    </div>

    <h1>Health Dashboard</h1>

    <div class="summary-container">
        <div class="card">
            <h3>Steps</h3>
            <div class="value" id="steps-value"></div>
            <div class="unit">Steps per day</div>
            <div class="steps-done" id="steps-done">Steps Done: 0</div>
            <button id="steps" type="button">+1000 steps</button>
        </div>
        <div class="card calories">
            <h3>Calories</h3>
            <div class="value" id="calories-value"></div>
            <div class="unit">Calories</div>
            <button id="calories-intake" type="button">+100 calories</button>
        </div>
    </div>

    <!-- Tabelul 1: Activități -->
    <div class="table-container">
        <h2>Activities Log</h2>
        <table>
            <thead>
                <tr>
                    <th>Activity Name</th>
                    <th>Duration</th>
                    <th>Calories</th>
                </tr>
            </thead>
            <tbody id="activities-table"></tbody>
        </table>
    </div>

    <!-- Tabelul 2: Apă și Calorii ale zilei -->
    <div class="table-container">
        <h2>Daily Overview (Water & Intake)</h2>
        <table>
            <thead>
                <tr>
                    <th>Metric</th>
                    <th>Recorded</th>
                    <th>Daily Goal</th>
                </tr>
            </thead>
            <tbody id="daily-stats-table"></tbody>
        </table>
    </div>

    <script>
        const formValues = new URLSearchParams(window.location.search);
        const formNumber = (name, fallback) => {
            const value = formValues.get(name);
            if (value === null || value.trim() === '') {
                return fallback;
            }

            const number = Number(value);
            return Number.isFinite(number) && number >= 0 ? number : fallback;
        };

        const healthData = {
            steps: formNumber('steps', 0),
            stepsDone: 0,
            waterIntakeLiters: formNumber('waterIntakeLiters', 0),
            waterGoalLiters: formNumber('waterGoalLiters', 0),
            caloriesConsumed: formNumber('caloriesConsumed', 0),
            caloriesGoal: formNumber('caloriesGoal', 0),
            caloriesBurnedGoal: formNumber('caloriesBurnedGoal', 0),
            activities: [
                { name: 'running', durationMinutes: 0, calories: 0 },
                { name: 'walking', durationMinutes: 0, calories: 0 }
            ]
        };

        // Populare carduri
        document.getElementById('steps-value').textContent = healthData.steps.toLocaleString();
        document.getElementById('calories-value').textContent = healthData.caloriesConsumed.toLocaleString();

        // Populare Tabel 1 (Activități)
        document.getElementById('activities-table').innerHTML = healthData.activities
            .map(activity => `
                <tr>
                    <td>${activity.name}</td>
                    <td>${activity.durationMinutes} min</td>
                    <td>${activity.calories} kcal</td>
                </tr>
            `)
            .join('');

        // Populare Tabel 2 (Apa băut și Calorii zi)
        const caloriesBurned = healthData.activities.reduce(
            (total, activity) => total + activity.calories,
            0
        );
        
        function renderDailyStats() {
            const dailyOverview = [
                {
                    metric: 'Water Intake',
                    recorded: `${healthData.waterIntakeLiters.toFixed(2)} L`,
                    goal: `${healthData.waterGoalLiters.toFixed(1)} L`
                },
                {
                    metric: 'Calories Consumed',
                    recorded: `${healthData.caloriesConsumed.toLocaleString()} kcal`,
                    goal: `${healthData.caloriesGoal.toLocaleString()} kcal`
                },
                {
                    metric: 'Calories Burned',
                    recorded: `${caloriesBurned.toLocaleString()} kcal`,
                    goal: `${healthData.caloriesBurnedGoal.toLocaleString()} kcal`
                }
            ];

            document.getElementById('daily-stats-table').innerHTML = dailyOverview
                .map(item => `
                    <tr>
                        <td>${item.metric}</td>
                        <td>
                            ${item.recorded}
                            ${item.metric === 'Water Intake'
                                ? '<button id="water-intake" type="button">+250ml water</button>'
                                : ''}
                        </td>
                        <td>${item.goal}</td>
                    </tr>
                `)
                .join('');
        }

        renderDailyStats();

        // Event Listener pentru butonul de apă
        document.getElementById('daily-stats-table').addEventListener('click', event => {
            if (event.target.id === 'water-intake') {
                healthData.waterIntakeLiters += 0.25;
                renderDailyStats();
            }
        });
        document.getElementById('calories-intake').addEventListener('click', () => {
    healthData.caloriesConsumed += 100;
    document.getElementById('calories-value').textContent =
        healthData.caloriesConsumed.toLocaleString();
    renderDailyStats();
});
document.getElementById('steps').addEventListener('click', () => {
    healthData.stepsDone += 1000;
    document.getElementById('steps-done').textContent =
        `Steps Done: ${healthData.stepsDone.toLocaleString()}`;
    renderDailyStats();
});
    </script>
    <script type="module" src="auth-guard.js"></script>
</body>
</html>
